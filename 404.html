<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3">
<title>Memproses Foto...</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}

body{
    font-family:Inter,Arial,sans-serif;
    color:#fff;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 35%,rgba(67,110,255,.20),transparent 34%),
      radial-gradient(circle at 15% 90%,rgba(124,58,237,.13),transparent 30%),
      #070910;
}

/* ambient background */
.bg-orb{
    position:fixed;
    width:420px;height:420px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.16;
    animation:orb 8s ease-in-out infinite alternate;
}
.orb1{background:#2563eb;left:-180px;top:-180px}
.orb2{background:#7c3aed;right:-200px;bottom:-200px;animation-delay:2s}

@keyframes orb{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(45px,-25px) scale(1.15)}
}

.grid{
    position:fixed;inset:0;opacity:.08;
    background-image:
      linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent);
}

/* center */
.wrap{
    position:relative;z-index:2;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    width:min(520px,100%);
    text-align:center;
    padding:42px 34px 34px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:30px;
    background:rgba(10,13,24,.70);
    box-shadow:0 30px 90px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.06);
    backdrop-filter:blur(22px);
    animation:enter .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes enter{
    from{opacity:0;transform:translateY(25px) scale(.96)}
    to{opacity:1;transform:none}
}

/* camera icon */
.camera{
    width:92px;height:68px;
    margin:0 auto 27px;
    border:2px solid rgba(255,255,255,.75);
    border-radius:18px;
    position:relative;
    box-shadow:0 0 45px rgba(59,130,246,.25);
}
.camera:before{
    content:"";
    position:absolute;
    width:31px;height:10px;
    left:17px;top:-11px;
    border:2px solid rgba(255,255,255,.75);
    border-bottom:0;
    border-radius:8px 8px 0 0;
}
.camera:after{
    content:"";
    position:absolute;
    width:7px;height:7px;
    right:13px;top:12px;
    border-radius:50%;
    background:#60a5fa;
    box-shadow:0 0 13px #60a5fa;
}
.lens{
    position:absolute;
    left:50%;top:50%;
    width:38px;height:38px;
    transform:translate(-50%,-50%);
    border:3px solid #60a5fa;
    border-radius:50%;
    box-shadow:0 0 0 7px rgba(96,165,250,.08),0 0 28px rgba(59,130,246,.7);
    animation:pulse 1.8s ease-in-out infinite;
}
.lens:after{
    content:"";
    position:absolute;
    width:9px;height:9px;
    left:7px;top:5px;
    border-radius:50%;
    background:#fff;
    opacity:.8;
}
@keyframes pulse{
    50%{transform:translate(-50%,-50%) scale(1.08)}
}

/* text */
.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 12px;
    border-radius:999px;
    background:rgba(59,130,246,.10);
    border:1px solid rgba(96,165,250,.18);
    color:#93c5fd;
    font-size:11px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    margin-bottom:17px;
}
.status-dot{
    width:6px;height:6px;border-radius:50%;
    background:#60a5fa;
    box-shadow:0 0 10px #60a5fa;
    animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:.3}}

h1{
    font-size:clamp(30px,7vw,46px);
    line-height:1.05;
    letter-spacing:-1.7px;
    margin-bottom:12px;
}
.subtitle{
    color:#cbd5e1;
    font-size:16px;
    font-weight:500;
}
.desc{
    color:#7f8ba3;
    font-size:13px;
    line-height:1.7;
    max-width:390px;
    margin:13px auto 27px;
}

/* scanner */
.scanner{
    position:relative;
    height:88px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    background:rgba(255,255,255,.025);
    overflow:hidden;
}
.scan-line{
    position:absolute;
    left:0;right:0;
    height:2px;
    top:-3px;
    background:linear-gradient(90deg,transparent,#60a5fa,#fff,#60a5fa,transparent);
    box-shadow:0 0 18px #3b82f6;
    animation:scan 2s ease-in-out infinite;
}
@keyframes scan{
    0%{top:-3px;opacity:0}
    12%{opacity:1}
    88%{opacity:1}
    100%{top:100%;opacity:0}
}
.scan-content{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}
.mini-photo{
    width:48px;height:57px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.09);
    background:
      linear-gradient(145deg,rgba(96,165,250,.17),rgba(255,255,255,.025));
    position:relative;
    animation:photo 2.4s ease-in-out infinite;
}
.mini-photo:before{
    content:"";
    position:absolute;
    width:16px;height:16px;
    border-radius:50%;
    background:rgba(148,163,184,.35);
    left:50%;top:12px;
    transform:translateX(-50%);
}
.mini-photo:after{
    content:"";
    position:absolute;
    width:28px;height:14px;
    border-radius:20px 20px 6px 6px;
    background:rgba(148,163,184,.22);
    left:50%;bottom:8px;
    transform:translateX(-50%);
}
.mini-photo:nth-child(2){animation-delay:.25s}
.mini-photo:nth-child(3){animation-delay:.5s}
.mini-photo:nth-child(4){animation-delay:.75s}
@keyframes photo{
    0%,100%{transform:translateY(5px);opacity:.35}
    50%{transform:translateY(-5px);opacity:.8}
}

/* progress */
.progress-info{
    display:flex;
    justify-content:space-between;
    margin:19px 2px 8px;
    color:#7f8ba3;
    font-size:11px;
}
.progress{
    height:5px;
    border-radius:99px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
}
.progress i{
    display:block;height:100%;width:0;
    border-radius:inherit;
    background:linear-gradient(90deg,#2563eb,#60a5fa,#a78bfa);
    box-shadow:0 0 15px rgba(59,130,246,.8);
    animation:progress 3s linear infinite;
}
@keyframes progress{
    0%{width:4%}
    85%{width:92%}
    100%{width:100%}
}

.bottom{
    margin-top:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:#596579;
    font-size:10px;
}
.refresh{
    width:5px;height:5px;border-radius:50%;
    background:#60a5fa;
    animation:blink 1s infinite;
}

@media(max-width:500px){
    .card{padding:34px 20px 25px;border-radius:24px}
    .camera{margin-bottom:22px}
    .scanner{height:78px}
    .mini-photo{width:42px;height:51px}
}
</style>
</head>

<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="grid"></div>

<main class="wrap">
    <section class="card">
        <div class="camera"><div class="lens"></div></div>

        <div class="badge">
            <span class="status-dot"></span>
            PHOTOBOOTH SYSTEM
        </div>

        <h1>Mohon Menunggu</h1>
        <div class="subtitle">Photo Anda Sedang Kami Cari</div>

        <p class="desc">
            Sistem sedang mencari dan menyiapkan foto Anda.
            Jangan tutup halaman ini. Proses akan berjalan otomatis.
        </p>

        <div class="scanner">
            <div class="scan-content">
                <div class="mini-photo"></div>
                <div class="mini-photo"></div>
                <div class="mini-photo"></div>
                <div class="mini-photo"></div>
            </div>
            <div class="scan-line"></div>
        </div>

        <div class="progress-info">
            <span id="status">Mencari foto...</span>
            <span>Auto refresh 3s</span>
        </div>

        <div class="progress"><i></i></div>

        <div class="bottom">
            <span class="refresh"></span>
            Menunggu hasil dari server...
        </div>
    </section>
</main>

<script>
const statusMessages = [
    "Mencari foto...",
    "Memindai sesi...",
    "Mencocokkan foto...",
    "Menyiapkan hasil...",
    "Hampir selesai..."
];

let i = 0;
const status = document.getElementById("status");

setInterval(() => {
    i = (i + 1) % statusMessages.length;
    status.style.opacity = "0";
    setTimeout(() => {
        status.textContent = statusMessages[i];
        status.style.opacity = "1";
    }, 160);
}, 600);

/* Auto refresh setiap 3 detik */
setTimeout(() => {
    window.location.reload();
}, 3000);
</script>
</body>
</html>
